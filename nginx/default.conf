# 定義 Docker upstream
upstream django {
    server web:8000;
}

upstream nodered {
    server nodered:1880;
}

upstream wordpress {
    server wordpress:80;
}

# HTTP 80，用於 Certbot 驗證及自動轉向 HTTPS
server {
    listen 80;
    server_name stephen25128.duckdns.org lightup380302.duckdns.org;

    client_max_body_size 500M;

    # Certbot 驗證路徑
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其餘流量轉向 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443，正式服務
server {
    listen 443 ssl http2;
    server_name stephen25128.duckdns.org lightup380302.duckdns.org;

    client_max_body_size 500M;

    # SSL 憑證路徑
    ssl_certificate /etc/letsencrypt/live/stephen25128.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stephen25128.duckdns.org/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node-RED
    location /nodered/ {
        proxy_pass http://nodered;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WordPress
    location /wordpress/ {
        proxy_pass http://wordpress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}